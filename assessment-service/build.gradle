apply plugin: 'uk.gov.laa.springboot.laa-spring-boot-gradle-plugin'

configurations {
    mockitoAgent {
        transitive = false
    }
}

configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.apache.tomcat.embed') {
            details.useVersion '11.0.23'
            details.because 'Temporary override to remediate vulnerability'
        }
        if (details.requested.group == 'ch.qos.logback') {
            details.useVersion '1.5.36'
            details.because 'Temporary override to remediate vulnerability'
        }
        if (details.requested.group == 'org.apache.logging.log4j') {
            details.useVersion '2.25.5'
            details.because 'Temporary override to remediate vulnerability'
        }
        if (details.requested.group == 'com.fasterxml.jackson.core' && details.requested.name == 'jackson-databind') {
            details.useVersion '2.22.1'
            details.because 'Temporary override to remediate vulnerability'
        }
        if (details.requested.group == 'com.fasterxml.jackson.core' && details.requested.name == 'jackson-annotations') {
            details.useVersion '2.22'
            details.because 'Temporary override to remediate vulnerability'
        }
        if (details.requested.group == 'org.apache.httpcomponents.core5') {
            details.useVersion '5.4.3'
            details.because 'Temporary override to remediate vulnerability'
        }
        if (details.requested.group == 'tools.jackson.core') {
            details.useVersion '3.2.1'
            details.because 'Temporary override to remediate vulnerability'
        }
    }
}

dependencies {
    implementation project(':assessment-api')

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'io.micrometer:micrometer-tracing-bridge-brave'
    runtimeOnly 'com.oracle.database.jdbc:ojdbc11'
    //Enable access token authentication
    implementation 'uk.gov.laa.springboot:laa-spring-boot-starter-auth'

    //Metrics
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    //Enable Swagger UI
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'

    //Used for integration tests
    testImplementation 'org.testcontainers:testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-oracle-free'

    mockitoAgent "org.mockito:mockito-core"
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()

    jvmArgs(
            "-javaagent:${configurations.mockitoAgent.asPath}",
            "-Xshare:off"
    )

    finalizedBy jacocoTestReport
}

jacocoTestReport {
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: ['**/AssessmentApplication.class'])
        }))
    }
}

jacocoTestCoverageVerification {
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: ['**/AssessmentApplication.class'])
        }))
    }
}
