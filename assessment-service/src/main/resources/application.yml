spring:
  application:
    name: laa-ccms-caab-assessment-api
    version: "@version@"
  datasource:
    url: ${CAAB_DATASOURCE_URL}
    driver-class-name: oracle.jdbc.OracleDriver
    username: ${CAAB_DATASOURCE_USERNAME}
    password: ${CAAB_DATASOURCE_PASSWORD}
    hikari:
      maxLifeTime: 300000 # 5 minutes - @Todo Needs review
      maximum-pool-size: 10
      minimum-idle: 5
      data-source-properties:
        oracle.jdbc.defaultConnectionValidation: LOCAL
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: none
    open-in-view: false
  threads:
    virtual:
      enabled: true

laa:
  springboot.starter.auth:
    authentication-header: "Authorization"
    authorized-clients: ${AUTHORIZED_CLIENTS}
    authorized-roles: ${AUTHORIZED_ROLES}
    unprotected-uris: ${UNPROTECTED_URIS}
  # Runs alongside the API key starter: bearer tokens are authenticated here, other
  # authentication-header values by the starter above, so callers migrate one at a time.
  springboot.starter.oauth2:
    resourceserver:
      jwt:
        tenants:
          - issuer-uri: ${OAUTH2_ISSUER_URI}
            audiences:
              - ${OAUTH2_AUDIENCE}
    authorized-roles: ${OAUTH2_AUTHORIZED_ROLES}
    unprotected-uris: ${UNPROTECTED_URIS}

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus

# ECS structured logging
logging:
  level:
    root: ${ROOT_LOGGING_LEVEL:info}
    org.springframework: ${SPRING_LOGGING_LEVEL:info}
    uk.gov.laa.ccms.caab: ${APP_LOGGING_LEVEL:info}
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: ${spring.application.name:default}
        version: ${spring.application.version:default}
        environment: ${spring.profiles.active:default}
        node_name: ${HOSTNAME:unknown}

---
# local profile configuration
spring:
  config:
    activate:
      on-profile: local

logging:
  structured:
    format:
      console: "" # disables structured logging locally
  pattern:
    console: "%clr(%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr([%X{traceId:-},%X{spanId:-},%X{sessionID:-}]){yellow} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n"
