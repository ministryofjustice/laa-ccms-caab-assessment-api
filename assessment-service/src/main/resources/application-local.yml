spring:
  datasource:
    url: jdbc:oracle:thin:@localhost:1521:EBSDB
    driver-class-name: oracle.jdbc.OracleDriver
    username: XXCCMS_PUI
    password: XXCCMS_PUI

  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: none

server:
  port: 8008


laa.springboot.starter.oauth2:
  resourceserver:
    jwt:
      tenants:
        # Placeholders to fill in, or override from the environment to point at a real tenant or a
        # mock issuer without editing this file.
        - issuer-uri: ${OAUTH2_ISSUER_URI:https://login.microsoftonline.com/xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx/v2.0}
          audiences:
            - ${OAUTH2_AUDIENCE:xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx}
  scopes-claim-path: scp
  authorized-roles: '[
      {
          "name": "test-role",
          "uris": [
              "/**"
          ]
      }
  ]'
  unprotected-uris: [ "/actuator/**", "/swagger-ui.html",
                      "/swagger-ui/**", "/v3/api-docs/**", "/favicon.ico", "/open-api-specification.yml"]
